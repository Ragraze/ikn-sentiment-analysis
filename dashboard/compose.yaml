services:
  backend:
    build: .
    environment:
      IKN_DATA_DIR: /data
      IKN_NOTEBOOKS_DIR: /notebooks
      IKN_TRUSTED_HOSTS: localhost,127.0.0.1,backend
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    volumes:
      - ../data:/data:ro
      - ../notebooks:/notebooks:ro
    expose:
      - "5000"
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        FLASK_API_URL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
